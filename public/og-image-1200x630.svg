  </text>

  <rect x="666" y="126" width="420" height="382" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="698" y="166" width="356" height="40" rx="10" fill="#111827"/>
  <text x="720" y="193" fill="#60A5FA" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500">
